<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <link rel="shortcut icon" href="favicon.webp" type="image/x-icon">

  <title>Happy Birthday Kik</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- Background -->
  <div class="background"></div>

  <!-- Floating stars -->
  <div class="stars" id="stars" aria-hidden="true"></div>

  <!-- Main scene -->
  <main class="scene">

    <!-- Birthday message -->
    <div class="text-overlay">

      <div class="recipient-name">
        To the girl who kept waiting <span class="sparkle">✨</span>
      </div>

      <div class="message">
        <span>From the bottom of my heart</span>
        <span>May your special day full of love</span>
        <span>From the moment you open your eyes</span>
        <span>Until you sleep for the night</span>
        <span>I'm glad it was you on March 8, 2026.</span>
        <span class="birthday-line">Happy Birthday Kik. ❤️</span>
      </div>

    </div>

    <!-- Animated heart -->
    <div class="heart-container">
      <canvas id="heartCanvas"></canvas>
    </div>

  </main>

  <!-- Music -->
  <audio id="birthdayMusic" loop preload="auto">
    <source src="./happy-birthday-music-box(chosic.com).mp3" type="audio/mpeg">
  </audio>

  <!-- Music button -->
  <button class="music-btn" id="musicBtn" type="button" aria-label="Play music">
    <span id="musicIcon">🎵</span>
    <span id="musicText">Music</span>
  </button>

  <!-- Theme switcher -->
  <div class="theme-switcher" role="toolbar" aria-label="Theme Switcher">

    <button class="theme-btn active" data-theme="midnight">
      <span class="theme-dot midnight-dot"></span>
      <span class="theme-name">Midnight</span>
    </button>

    <button class="theme-btn" data-theme="golden">
      <span class="theme-dot golden-dot"></span>
      <span class="theme-name">Golden</span>
    </button>

    <button class="theme-btn" data-theme="cyber">
      <span class="theme-dot cyber-dot"></span>
      <span class="theme-name">Cyber</span>
    </button>

    <button class="theme-btn" data-theme="emerald">
      <span class="theme-dot emerald-dot"></span>
      <span class="theme-name">Emerald</span>
    </button>

    <button class="theme-btn" data-theme="velvet">
      <span class="theme-dot velvet-dot"></span>
      <span class="theme-name">Velvet</span>
    </button>

  </div>

  <script src="./script.js"></script>

</body>

</html>
