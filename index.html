    <!-- Birthday message -->
    <div class="text-overlay">
      <span class="recipient-name">To the girl who kept waiting ✨</span><br>

  <!-- Theme switcher -->
  <div class="theme-switcher" role="toolbar" aria-label="Theme Switcher">

    <button class="theme-btn active"
      data-theme="midnight"
      title="Midnight Romance"
      aria-label="Midnight Romance">
      <span class="theme-dot"></span>
      <span class="theme-name">Midnight</span>
    </button>

    <button class="theme-btn"
      data-theme="golden"
      title="Golden Sunset"
      aria-label="Golden Sunset">
      <span class="theme-dot"></span>
      <span class="theme-name">Golden</span>
    </button>

    <button class="theme-btn"
      data-theme="cyber"
      title="Cyberpunk Love"
      aria-label="Cyberpunk Love">
      <span class="theme-dot"></span>

    <button class="theme-btn"
      data-theme="emerald"
