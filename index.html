<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="shortcut icon" href="favicon.webp" type="image/x-icon">

  <title>Happy Birthday Kik</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- Background -->
  <div class="background"></div>

  <!-- Stars -->
  <div class="stars" id="stars"></div>

  <!-- Main scene -->
  <main class="scene">

    <!-- Birthday message -->
    <section class="text-overlay">

      <div class="recipient-name">
        To the girl who kept waiting
        <span class="sparkle">✦</span>
      </div>

      <div class="message">
        <div>From the bottom of my heart</div>
        <div>May your special day full of love</div>
        <div>From the moment you open your eyes</div>
        <div>Until you sleep for the night</div>
        <div>I'm glad it was you on March 8, 2026.</div>
        <div>Happy Birthday Kik. ❤️</div>
      </div>

    </section>

    <!-- Animated heart -->
    <div class="heart-container">
      <canvas id="heartCanvas"></canvas>
    </div>

  </main>

  <!-- Theme switcher -->
  <div class="theme-switcher" role="toolbar" aria-label="Theme Switcher">

    <button
      class="theme-btn active"
      data-theme="midnight"
      title="Midnight Romance">

      <span
        class="theme-dot"
        style="background: linear-gradient(135deg, #ff0080, #7928ca);">
      </span>

      <span class="theme-name">Midnight</span>

    </button>

    <button
      class="theme-btn"
      data-theme="golden"
      title="Golden Sunset">

      <span
        class="theme-dot"
        style="background: linear-gradient(135deg, #ffcc66, #ff8c00);">
      </span>

      <span class="theme-name">Golden</span>

    </button>

    <button
      class="theme-btn"
      data-theme="cyber"
      title="Cyber Love">

      <span
        class="theme-dot"
        style="background: linear-gradient(135deg, #00f2fe, #4facfe);">
      </span>

      <span class="theme-name">Cyber</span>

    </button>

    <button
      class="theme-btn"
      data-theme="emerald"
      title="Emerald Enchantment">

      <span
        class="theme-dot"
        style="background: linear-gradient(135deg, #00b09b, #96c93d);">
      </span>

      <span class="theme-name">Emerald</span>

    </button>

    <button
      class="theme-btn"
      data-theme="velvet"
      title="Velvet Passion">

      <span
        class="theme-dot"
        style="background: linear-gradient(135deg, #ff0844, #ffb199);">
      </span>

      <span class="theme-name">Velvet</span>

    </button>

  </div>

  <script src="./script.js"></script>

</body>

</html>
